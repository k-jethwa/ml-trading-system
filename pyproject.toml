[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mltrading"
version = "0.1.0"
description = "End-to-end ML cross-sectional equity trading system (V1: data ingestion, features, models, portfolio, backtest)."
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
viz = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
